<style>
:root{--bg:#0A0E1A;--bg2:#131826;--card:#1A2030;--g:#00E676;--r:#FF3B4E;--gr:#888;--gold:#FFD700;--t:#fff;--t2:#A0A6B8;--e:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}

.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:auto;position:relative}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:800;letter-spacing:1px}
header svg{color:var(--gold)}
main{flex:1;overflow-y:auto;padding:0 12px 12px}
.scr{display:none}.scr.on{display:block;animation:in .3s var(--e)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}

@keyframes pd{50%{text-shadow:0 0 18px var(--r);transform:scale(1.04)}}
.chart{height:170px;position:relative}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:8px}
.seg button{flex:1;padding:8px;border:0;border-radius:10px;background:none;color:var(--t2);font:600 14px Inter}
.seg button.on.b{background:var(--g);color:#000}.seg button.on.s{background:var(--r);color:#fff}
input{width:100%;background:var(--bg2);border:1px solid #2a3350;color:#fff;border-radius:12px;padding:12px;font-size:18px;outline:0;user-select:text}

.go.b{background:var(--g);--c:0,230,118}.go.s{background:var(--r);color:#fff;--c:255,59,78}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(var(--c),.5)}70%,100%{box-shadow:0 0 0 14px rgba(var(--c),0)}}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s var(--e)}
@keyframes rp{to{transform:scale(3);opacity:0}}
#rg button.on{background:#2a3350;color:#fff}
.h{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #232b40;font-size:12px}
nav{display:flex;background:var(--bg2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--t2);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px Inter;padding:4px}
nav button.on{color:var(--g)}
#toast{position:fixed;top:10px;left:50%;transform:translate(-50%,-150%);width:calc(100% - 24px);max-width:456px;background:var(--card);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;z-index:9;box-shadow:0 8px 30px #000a;transition:transform .5s cubic-bezier(.3,1.5,.5,1);border-left:4px solid var(--gr)}
#toast.show{transform:translate(-50%,0)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:8}
#flash.f{animation:fl .6s}@keyframes fl{0%{opacity:.35}100%{opacity:0}}
.shake{animation:sh .5s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fn{position:fixed;font-weight:700;pointer-events:none;z-index:9;animation:fu 1.5s var(--e) forwards}
@keyframes fu{to{transform:translateY(-70px);opacity:0}}
.cf{position:fixed;width:8px;height:8px;top:40%;left:50%;z-index:9;pointer-events:none;border-radius:2px}
.bar{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--gold));transition:width .8s var(--e)}
.btn{padding:12px;border:0;border-radius:12px;background:var(--bg2);color:var(--t);font:600 14px Inter;width:100%;margin-top:8px}
.btn.gold{background:var(--gold);color:#000}.btn:disabled{opacity:.4}
.btn{display:flex;align-items:center;justify-content:center;gap:6px}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
input[type=range]{accent-color:var(--gold)}
#sheet{position:fixed;inset:0;z-index:10;pointer-events:none}#sheet.on{pointer-events:auto}
.bd{position:absolute;inset:0;background:#0009;opacity:0;transition:opacity .3s}#sheet.on .bd{opacity:1}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:auto;max-height:85%;overflow-y:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:14px;transform:translateY(100%);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}#sheet.on .pn{transform:none}
.pkx svg.i{width:40px;height:40px}
.pkx .pk{transform-origin:4px 20px;animation:hit 1.6s ease-in-out infinite}
@keyframes hit{0%,55%,100%{transform:rotate(-8deg)}68%{transform:rotate(12deg)}80%{transform:rotate(-4deg)}}
</style></head><body>
<div id="app">
<header><svg class="i" id="logo"></svg>MOONTRADE<span style="flex:1"></span><span class="s m" id="lvTop"></span></header>
<main>
<section class="scr on" id="s0">

</section>
<section class="scr" id="s2">

  <div class="bar" style="margin-top:10px"><i id="xpb"></i></div><div class="s m" id="xpt" style="margin-top:4px"></div></div>
 <div class="card" id="stat"></div>
 <div class="card"><button class="btn gold" id="daily">Ежедневный бонус</button>
  <button class="btn" id="mute"></button><button class="btn" id="reset" style="color:var(--r)">Сбросить прогресс</button></div>
</section>
<section class="scr" id="s3"><div id="mine"></div></section>
</main>
<nav><button class="on" data-t="0"><svg class="i" data-i="chart"></svg>Трейд</button><button data-t="3"><svg class="i" data-i="pickaxe"></svg>Майнинг</button><button data-t="1"><svg class="i" data-i="wallet"></svg>Портфель</button><button data-t="2"><svg class="i" data-i="user"></svg>Профиль</button></nav>
</div>
<div id="sheet"><div class="bd" onclick="closeSh()"></div><div class="pn" id="shc"></div></div>
<div id="toast"></div><div id="flash"></div>
<script>
"use strict";
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0A0E1A');tg?.setBackgroundColor?.('#0A0E1A')}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// ---------- SVG-иконки (stroke, 24x24) ----------
const IC={moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 13h3"/>',chart:'<path d="M3 17l5-6 4 3 8-9M3 21h18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
up:'<path d="M5 15l7-7 7 7"/>',down:'<path d="M5 9l7 7 7-7"/>',rocket:'<path d="M12 3c4 2 6 6 5 11l-5 4-5-4c-1-5 1-9 5-11zM9 18l-2 3M15 18l2 3"/><circle cx="12" cy="10" r="1.5"/>',whale:'<path d="M3 13c0-4 4-7 9-7s9 3 9 7c-3 0-4 2-9 2s-6-2-9-2zM17 6l2-3M7 10h.01"/>',news:'<path d="M5 4h12v16H7a2 2 0 0 1-2-2zM17 8h3v10a2 2 0 0 1-2 2M8 8h6M8 12h6"/>',fire:'<path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>',warning:'<path d="M12 3l10 18H2zM12 10v5M12 18h.01"/>',skull:'<path d="M5 12a7 7 0 1 1 14 0v3l-2 1v3H7v-3l-2-1zM9 12h.01M15 12h.01M10 19v-2M14 19v-2"/>',gift:'<path d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9c-3 0-4-4-1-4s1 4 1 4zm0 0c3 0 4-4 1-4s-1 4-1 4z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',bank:'<path d="M3 10l9-6 9 6zM5 10v8M9 10v8M15 10v8M19 10v8M3 21h18"/>',dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/>',sleep:'<path d="M5 6h6l-6 6h6M13 12h5l-5 6h5"/>',crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8"/>',check:'<path d="M5 12l5 5 9-10"/>',handshake:'<path d="M2 12l5-5 4 2 4-2 5 5-6 6-3-2-3 2zM7 7L2 12"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]||''}</svg>`;
const setIc=(el,n)=>{el.setAttribute('viewBox','0 0 24 24');el.innerHTML=IC[n]};
setIc($('#logo'),'moon');setIc($('#crown'),'crown');$$('[data-i]').forEach(e=>setIc(e,e.dataset.i));
// ---------- Хаптик и звуки (WebAudio, без файлов) ----------
const hap=t=>{const h=tg?.HapticFeedback;if(!h)return;['light','medium','heavy'].includes(t)?h.impactOccurred(t):h.notificationOccurred(t)};
let ac;const tone=(f,d=.08,ty='sine',v=.07,f2)=>{if(!S.snd)return;try{ac=ac||new AudioContext();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);f2&&o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}};
const SFX={tap:()=>tone(650,.05),buy:()=>tone(500,.16,'triangle',.09,950),sell:()=>tone(900,.16,'triangle',.09,420),err:()=>tone(180,.2,'square',.05),pos:()=>{tone(600,.12);setTimeout(()=>tone(900,.22),110)},neg:()=>{tone(420,.14,'sawtooth',.05);setTimeout(()=>tone(240,.3,'sawtooth',.05),130)},lvl:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle'),i*110)),tick:()=>tone(1200,.03,'sine',.02)};
const sfx=n=>SFX[n]?.();
// ---------- Состояние ----------
const K='moontrade_v1';
const def=()=>({usd:100,moon:0,xp:0,lvl:1,tr:0,win:0,loss:0,vol:0,fees:0,avg:0,real:0,best:0,worst:0,price:10,h:[],th:[],daily:0,snd:1,t0:Date.now(),farm:{v2:1,rk:0,cl:0,ch:0,ph:[],sc:[],st:[],pend:0,last:Date.now(),nid:1}});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=def()}
if(!S.farm.v2){S.farm.v2=1;S.farm.rk=Math.max(S.farm.rk,S.farm.ph.length)}
if(!S.h.length)S.h=Array(60).fill(S.price);
const save=()=>{S.lp=S.price;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};setInterval(save,5000);
// ---------- Утилиты ----------
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const gauss=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const usdF=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const priceF=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const numF=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
const cu=(el,v,f)=>{const a=+el.dataset.v||0;el.dataset.v=v;const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/400);el.textContent=f(a+(v-a)*k);if(k<1)requestAnimationFrame(s)})(t0)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const notify=(type,value)=>{if(!tg?.initData)return;fetch('/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,type,value})}).catch(()=>{})};
// ---------- Рынок: считается на сервере 24/7 ----------
let prev=S.price,lastEv=-1,range='5м',first=true,rf=true,pc=0;const RM={'1ч':'1h','24ч':'24h','7д':'7d'};
const api=(p,b)=>fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',...b})}:undefined).then(r=>{if(!r.ok)throw r.status;return r.json()});
async function poll(){
 try{const m=await api('/api/market');
  if(first&&S.lp){const d=(m.p/S.lp-1)*100;if(Math.abs(d)>=.5)setTimeout(()=>toast('chart',`Пока тебя не было: $MOON ${d>0?'+':''}${d.toFixed(1)}%`,d>0?'g':'r'),700)}
  S.price=m.p;if(range==='5м')S.h=m.h;else if(rf||++pc%5===0){S.h=await api('/api/history?r='+RM[range]);rf=false}S.news=m.ev;S.fx=m.fx;
  m.ev.forEach(e=>{
   if(e.kind==='air'&&e.id>(S.air||0)&&Date.now()-e.t<18e5){S.air=e.id;S.moon+=10;toast('gift','Airdrop: +10 $MOON тебе','g');sfx('pos');hap('success')}
   if(e.id>lastEv){if(!first)showEv(e);lastEv=e.id}});
  first=false;
  if(S.price!==prev){const ch=(S.price/prev-1)*100;if(Math.abs(ch)>5){hap('heavy');sfx(ch>0?'pos':'neg')}else if(Math.abs(ch)>1)hap('medium');flashPrice(S.price>prev);prev=S.price}
  render()}catch(e){}
}
const showEv=e=>{if(e.kind!=='air')e.pct?alertPct(e.pct,e.text,e.icon):toast(e.icon,e.text,'')};
function alertPct(p,text,icon){
 toast(icon,`${text}  ${p>0?'+':''}${p.toFixed(1)}%`,p>0?'g':'r');
 p>0?sfx('pos'):sfx('neg');
 if(Math.abs(p)>=1.5){const f=$('#flash');f.style.background=p>0?'var(--g)':'var(--r)';f.classList.remove('f');void f.offsetWidth;f.classList.add('f');hap('heavy')}
 if(p<=-1.5)(()=>{const a=$('#app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')})();
}
let tt;function toast(icon,text,c){const t=$('#toast');t.style.borderColor=c==='g'?'var(--g)':c==='r'?'var(--r)':'var(--gr)';t.innerHTML=`<span class="${c==='g'?'up':c==='r'?'dn':''}">${ic(icon)}</span><span style="font-weight:600">${text}</span>`;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3500)}
// ---------- Торговля ----------
let side='b';const FEE=.01;
const impact=a=>Math.min(5,a/1e5*25);
const amt=()=>Math.max(0,parseFloat($('#amt').value)||0);
function preview(){
 const a=amt(),p=S.price,c=a*p,f=c*FEE,im=impact(a)*(side==='b'?1:-1),np=p*(1+im/100);
 $('#pv').innerHTML=a?`Стоимость: <b class="m">${usdF(c)}</b><br>Комиссия 1%: <b class="m">${usdF(f)}</b><br>Влияние: <b class="m ${im>=0?'up':'dn'}">${im>=0?'+':''}${im.toFixed(3)}%</b>, новая цена: <b class="m">${priceF(np)}</b><br>${side==='b'?'Итого':'Получишь'}: <b class="m">${usdF(side==='b'?c+f:c-f)}</b>`:'<br><br><br>';
}
let busy=false;
async function exec(){
 if(busy)return;const raw=$('#amt').value.trim().toLowerCase();const cm=CMDS[raw.split(/\s+/)[0]];if(cm)return cm(raw);if(raw[0]==='/'){$('#amt').value='';preview();return err('Неизвестная команда')}let a=amt();const c0=a*S.price;
 if(!tg?.initData)return err('Открой игру через кнопку в боте, не в браузере');
 if(c0<1)return err('Минимальная сделка $1');
 if(side==='b'&&S.usd<c0*(1+FEE)-1e-9)return err('Недостаточно средств');
 if(side==='s'&&S.moon<a-1e-9)return err('Недостаточно $MOON');
 busy=true;let r;try{r=await api('/api/trade',{side,amount:a,fee:FEE})}catch(e){busy=false;return err(e===429?'Не так быстро':e===401?'Ошибка авторизации (401): открой игру кнопкой в боте':typeof e==='number'?'Сервер ответил '+e+' (задеплоен новый bot.js?)':'Нет связи с сервером')}busy=false;
 const p=r.p;if(side==='b'&&S.usd<a*p*(1+FEE))a=Math.floor(S.usd/(p*(1+FEE))*100)/100;
 const c=a*p,f=c*FEE;let net;
 if(c<1){S.price=r.np;return err('Цена изменилась, попробуй ещё раз')}
 if(side==='b'){const tot=c+f;S.usd-=tot;S.avg=(S.avg*S.moon+c)/(S.moon+a);S.moon+=a;net=-tot;sfx('buy')}
 else{net=c-f;const pnl=net-a*S.avg;S.real+=pnl;pnl>=0?S.win++:S.loss++;S.best=Math.max(S.best,pnl);S.worst=Math.min(S.worst,pnl);
  S.moon-=a;if(S.moon<1e-9){S.moon=0;S.avg=0}S.usd+=net;sfx('sell');hap(pnl>=0?'success':'warning')}
 S.price=r.np;S.tr++;S.vol+=c;S.fees+=f;S.th.unshift({s:side,a,p,t:Date.now()});if(S.th.length>20)S.th.pop();
 if(c>1000)tone(300,.4,'triangle',.1,1200);
 float((net>0?'+':'')+usdF(net),net>=0);hap('medium');addXp(Math.log10(c+1)*15);
 $('#amt').value='';prev=S.price;render();save();sync();
}
const err=m=>{sfx('err');hap('error');toast('warning',m,'r')};
function float(t,up){const e=document.createElement('div');e.className='fn m '+(up?'up':'dn');e.textContent=t;const r=$('#go').getBoundingClientRect();e.style.left=r.left+r.width/2-40+'px';e.style.top=r.top+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}

{const b0=F().pend,n0=F().sc.length,el=mineTick();if(el>300)setTimeout(()=>{const lost=F().sc.length-n0;toast('pickaxe',`Ферма за время отсутствия: +${numF(F().pend-b0)} $MOON`+(lost>0?`, сгорело: ${lost}`:''),lost>0?'r':'g')},1500)}

const MF=.03;
async function farmSell(){
 const f=F(),a=Math.floor(f.pend*100)/100;
 if(busy)return;if(a*S.price<1)return err('Минимум $1: намайнено слишком мало');
 if(!tg?.initData)return err('Открой игру через кнопку в боте');
 busy=true;let r;try{r=await api('/api/trade',{side:'s',amount:a,fee:MF})}catch(e){busy=false;return err(e===429?'Не так быстро':e===403?'Кошелёк заморожен':'Нет связи с биржей')}busy=false;
 const c=a*r.p,fee=c*MF;S.usd+=c-fee;f.pend-=a;S.price=r.np;prev=S.price;S.tr++;S.vol+=c;S.fees+=fee;
 toast('pickaxe',`Продано ${numF(a)} $MOON: +${usdF(c-fee)} (комиссия ${usdF(fee)} ушла в рынок)`,'g');sfx('sell');hap('success');render();save();sync();mineUI()}
